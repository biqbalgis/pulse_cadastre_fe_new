services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      # pulse_cadastre_fe already uses port 80.
      - "8081:80"
    container_name: pulse_cadastre_frontend_new
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
